<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Petrogas Procurement &amp; Contract Governance</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="auth-body">

<div class="auth-page">
  <div class="auth-card">
    <div class="brand"><span class="dot"></span> Petrogas Procurement &amp; Contract Governance</div>

    <div id="setupNotice" class="auth-note" hidden>No accounts exist yet — create the first Admin account to get started.</div>
    <div id="errorBox" class="auth-error" hidden></div>

    <div id="loginView">
      <h1>Log in</h1>
      <p class="subtitle">Use the email and password an Admin gave you.</p>
      <form id="loginForm">
        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" style="width:100%;">Log in</button>
      </form>
    </div>

    <div id="setupView" hidden>
      <h1>Create Admin account</h1>
      <p class="subtitle">This runs once, for the very first user of this system.</p>
      <form id="setupForm">
        <div class="form-row">
          <label for="setupName">Name</label>
          <input type="text" id="setupName" required>
        </div>
        <div class="form-row">
          <label for="setupEmail">Email</label>
          <input type="email" id="setupEmail" required autocomplete="username">
        </div>
        <div class="form-row">
          <label for="setupPassword">Password</label>
          <input type="password" id="setupPassword" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" style="width:100%;">Create Admin account</button>
      </form>
    </div>
  </div>
</div>

<script>
function showError(msg) {
  const box = document.getElementById("errorBox");
  box.textContent = msg;
  box.hidden = false;
}

function redirectTarget() {
  const params = new URLSearchParams(location.search);
  return params.get("redirect") || "index.html";
}

async function checkSetup() {
  const res = await fetch("/api/me", { credentials: "same-origin" });
  if (res.ok) {
    location.href = redirectTarget();
    return;
  }
  const body = await res.json().catch(() => ({}));
  if (body.setupRequired) {
    document.getElementById("setupNotice").hidden = false;
    document.getElementById("loginView").hidden = true;
    document.getElementById("setupView").hidden = false;
  }
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  document.getElementById("errorBox").hidden = true;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const res = await fetch("/api/login", {
    method: "POST",
    credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    showError(body.error || "Log in failed.");
    return;
  }
  location.href = redirectTarget();
});

document.getElementById("setupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  document.getElementById("errorBox").hidden = true;
  const name = document.getElementById("setupName").value;
  const email = document.getElementById("setupEmail").value;
  const password = document.getElementById("setupPassword").value;
  const res = await fetch("/api/setup", {
    method: "POST",
    credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, email, password })
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    showError(body.error || "Setup failed.");
    return;
  }
  location.href = "index.html";
});

checkSetup();
</script>
</body>
</html>
